<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1554d1">
<title>द्वारकाधिश जमा बाकी बुक</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#111;font-family:system-ui,"Noto Sans Devanagari",sans-serif}
.header{background:#1554d1;color:#fff;padding:22px 18px 28px;border-radius:0 0 34px 34px}
.small{font-size:15px;margin-bottom:8px}h1{margin:0;font-size:28px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.stat{background:#ffffff18;border:1px solid #ffffff40;border-radius:20px;padding:14px}.stat b{display:block;font-size:24px;margin-top:6px}
.container{max-width:760px;margin:auto;padding:18px 14px 90px}.search{width:100%;border:0;border-radius:18px;padding:16px;font-size:17px;box-shadow:0 3px 15px #0001;outline:0;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 3px 15px #0000000d}
button{border:0;border-radius:16px;padding:14px 10px;font-size:16px;font-weight:700}.primary{background:#1554d1;color:#fff}.green{background:#dff7e8;color:#087a3b}.red{background:#ffe3e3;color:#b42318}.blue{background:#e3efff;color:#1457b8}.outline{background:#fff;border:1px solid #ddd}
label{display:block;font-weight:700;margin:10px 0 6px}input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:16px;outline:0}textarea{min-height:70px}
.customer h3{margin:0 0 8px;font-size:19px}.row{display:flex;justify-content:space-between;margin:7px 0}.balance{font-size:21px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.muted{color:#666;font-size:14px}.empty{text-align:center;color:#777;padding:25px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:7px 5px;z-index:10}.bottom button{background:#fff;font-size:14px;padding:8px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;overflow:auto}.modalbox{background:#fff;border-radius:24px;padding:18px;max-width:650px;margin:30px auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{background:#eee;border-radius:50%;width:40px;height:40px;padding:0}
.totalline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
@media(max-width:420px){h1{font-size:25px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><div class="small">|| श्री कृष्ण ||</div><h1>द्वारकाधिश जमा बाकी बुक</h1>
<div class="stats"><div class="stat">एकूण ग्राहक<b id="customerCount">0</b></div><div class="stat">एकूण बाकी<b>₹ <span id="totalDue">0</span></b></div></div></header>

<main class="container">
<input id="search" class="search" placeholder="🔎 ग्राहकाचे नाव शोधा..." oninput="render()">
<div class="grid"><button class="primary" onclick="openAdd()">➕ ग्राहक जमा/बाकी</button><button class="blue" onclick="showSummary()">📊 जमा बाकी रिपोर्ट</button></div>
<div class="card"><b>💰 आजचा व्यवहार</b><div class="totalline"><span>आज जमा</span><strong>₹ <span id="todayPaid">0</span></strong></div><div class="totalline"><span>आज नवीन बाकी</span><strong>₹ <span id="todayDue">0</span></strong></div></div>
<div id="list"></div></main>

<nav class="bottom"><button onclick="scrollTo({top:0,behavior:'smooth'})">🏠<br>होम</button><button onclick="openAdd()">➕<br>जमा/बाकी</button><button onclick="showSummary()">📊<br>रिपोर्ट</button></nav>

<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">नवीन ग्राहक</h2><button class="close" onclick="closeModal()">✕</button></div>
<input type="hidden" id="editId"><label>ग्राहकाचे नाव *</label><input id="name" placeholder="उदा. राम पाटील">
<label>मोबाईल नंबर</label><input id="mobile" inputmode="numeric" maxlength="10" placeholder="मोबाईल नंबर">
<label>एकूण बिल / व्यवहार रक्कम</label><input id="bill" type="number" min="0" placeholder="₹ रक्कम">
<label>जमा रक्कम</label><input id="paid" type="number" min="0" placeholder="₹ जमा">
<label>नोंद</label><textarea id="note" placeholder="उदा. किराणा माल, उधारी, इ."></textarea>
<div class="grid" style="margin-top:15px"><button class="primary" onclick="saveCustomer()">💾 सेव्ह करा</button><button class="outline" onclick="closeModal()">रद्द करा</button></div>
</div></div>

<div id="summaryModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>📊 जमा बाकी रिपोर्ट</h2><button class="close" onclick="summaryModal.style.display='none'">✕</button></div>
<div class="totalline"><span>एकूण ग्राहक</span><strong id="sCustomers">0</strong></div><div class="totalline"><span>एकूण बिल</span><strong>₹ <span id="sBill">0</span></strong></div>
<div class="totalline"><span>एकूण जमा</span><strong>₹ <span id="sPaid">0</span></strong></div><div class="totalline"><span>एकूण बाकी</span><strong>₹ <span id="sDue">0</span></strong></div>
<button class="primary" style="width:100%;margin-top:15px" onclick="printReport()">🖨️ रिपोर्ट प्रिंट</button></div></div>

<script>
const KEY="dwarkadhish_jama_baki_v1";let data=JSON.parse(localStorage.getItem(KEY)||"[]");
const money=n=>Number(n||0).toLocaleString("en-IN");
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function openAdd(){modalTitle.textContent="नवीन ग्राहक";["editId","name","mobile","bill","paid","note"].forEach(id=>document.getElementById(id).value="");modal.style.display="block"}
function closeModal(){modal.style.display="none"}
function openEdit(id){let x=data.find(a=>a.id===id);if(!x)return;modalTitle.textContent="ग्राहक माहिती बदला";editId.value=x.id;name.value=x.name;mobile.value=x.mobile||"";bill.value=x.bill||0;paid.value=x.paid||0;note.value=x.note||"";modal.style.display="block"}
function saveCustomer(){let n=name.value.trim(),m=mobile.value.trim(),b=Number(bill.value||0),p=Number(paid.value||0),no=note.value.trim();if(!n)return alert("कृपया ग्राहकाचे नाव टाका.");if(p>b&&b>0)return alert("जमा रक्कम बिलापेक्षा जास्त असू नये.");let id=editId.value;if(id){let x=data.find(a=>a.id===id);Object.assign(x,{name:n,mobile:m,bill:b,paid:p,note:no})}else data.unshift({id:Date.now().toString(),name:n,mobile:m,bill:b,paid:p,note:no,createdAt:new Date().toISOString()});save();closeModal();render()}
function removeCustomer(id){if(confirm("हा ग्राहक आणि त्याचा हिशोब हटवायचा आहे का?")){data=data.filter(x=>x.id!==id);save();render()}}
function addPayment(id){let x=data.find(a=>a.id===id),v=prompt("जमा रक्कम टाका:");if(v===null)return;let n=Number(v);if(!n||n<0)return alert("योग्य रक्कम टाका.");x.paid=Number(x.paid||0)+n;x.lastPayment=n;x.lastPaymentDate=new Date().toISOString();save();render()}
function render(){let q=document.getElementById("search").value.trim().toLowerCase(),f=data.filter(x=>x.name.toLowerCase().includes(q)||(x.mobile||"").includes(q));list.innerHTML=f.length?f.map(x=>{let d=Math.max(0,Number(x.bill||0)-Number(x.paid||0));return `<div class="customer card"><h3>👤 ${esc(x.name)}</h3>${x.mobile?`<div class="muted">📱 ${esc(x.mobile)}</div>`:""}<div class="row"><span>एकूण बिल</span><b>₹ ${money(x.bill)}</b></div><div class="row"><span>जमा</span><b style="color:#087a3b">₹ ${money(x.paid)}</b></div><div class="row"><span>बाकी</span><span class="balance" style="color:${d>0?'#c62828':'#087a3b'}">₹ ${money(d)}</span></div>${x.note?`<div class="muted">📝 ${esc(x.note)}</div>`:""}<div class="actions"><button class="green" onclick="addPayment('${x.id}')">💰 जमा करा</button><button class="blue" onclick="openEdit('${x.id}')">✏️ बदला</button><button class="red" onclick="removeCustomer('${x.id}')">🗑️ हटवा</button><button class="outline" onclick="shareCustomer('${x.id}')">📤 शेअर</button></div></div>`}).join(""):'<div class="card empty">📒 अजून कोणताही ग्राहक जोडलेला नाही.</div>';updateStats()}
function updateStats(){customerCount.textContent=data.length;let due=data.reduce((s,x)=>s+Math.max(0,Number(x.bill||0)-Number(x.paid||0)),0);totalDue.textContent=money(due);let t=new Date().toISOString().slice(0,10);todayPaid.textContent=money(data.reduce((s,x)=>s+(x.lastPaymentDate?.slice(0,10)===t?Number(x.lastPayment||0):0),0));todayDue.textContent=money(data.filter(x=>x.createdAt?.slice(0,10)===t).reduce((s,x)=>s+Math.max(0,Number(x.bill||0)-Number(x.paid||0)),0))}
function showSummary(){let b=data.reduce((s,x)=>s+Number(x.bill||0),0),p=data.reduce((s,x)=>s+Number(x.paid||0),0);sCustomers.textContent=data.length;sBill.textContent=money(b);sPaid.textContent=money(p);sDue.textContent=money(Math.max(0,b-p));summaryModal.style.display="block"}
function shareCustomer(id){let x=data.find(a=>a.id===id),d=Math.max(0,x.bill-x.paid),t=`द्वारकाधिश जमा बाकी बुक\nग्राहक: ${x.name}\nएकूण बिल: ₹${money(x.bill)}\nजमा: ₹${money(x.paid)}\nबाकी: ₹${money(d)}`;if(navigator.share)navigator.share({title:"जमा बाकी",text:t});else navigator.clipboard?.writeText(t).then(()=>alert("हिशोब कॉपी झाला."))}
function printReport(){let b=data.reduce((s,x)=>s+Number(x.bill||0),0),p=data.reduce((s,x)=>s+Number(x.paid||0),0),r=data.map(x=>`<tr><td>${esc(x.name)}</td><td>₹${money(x.bill)}</td><td>₹${money(x.paid)}</td><td>₹${money(Math.max(0,x.bill-x.paid))}</td></tr>`).join(""),w=open("","_blank");w.document.write(`<html><meta charset="UTF-8"><body><h2>द्वारकाधिश जमा बाकी बुक</h2><p>ग्राहक: ${data.length} | बिल: ₹${money(b)} | जमा: ₹${money(p)} | बाकी: ₹${money(Math.max(0,b-p))}</p><table border="1" cellpadding="8" cellspacing="0" width="100%"><tr><th>ग्राहक</th><th>बिल</th><th>जमा</th><th>बाकी</th></tr>${r}</table><script>print()<\/script></body></html>`);w.document.close()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
</body></html>
