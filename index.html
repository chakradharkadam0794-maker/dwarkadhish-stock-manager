<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1554d1">

<title>द्वारकाधिश स्टॉक मॅनेजर</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fc;
  color:#172033;
}

.header{
  background:#1554d1;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0 0 6px;
  font-size:25px;
}

.header p{
  margin:0;
  font-size:14px;
}

.container{
  max-width:850px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:20px;
}

input,select{
  width:100%;
  padding:12px;
  margin:6px 0 10px;
  border:1px solid #ccd4e0;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 15px;
  font-size:15px;
  cursor:pointer;
  margin:4px;
}

.primary{
  background:#1554d1;
  color:white;
}

.success{
  background:#168a4a;
  color:white;
}

.danger{
  background:#d93025;
  color:white;
}

.light{
  background:#eaf1ff;
  color:#1554d1;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  padding:15px 8px;
  border-radius:12px;
  text-align:center;
  background:#eef3ff;
}

.stat strong{
  display:block;
  font-size:23px;
  margin-top:5px;
}

.search{
  margin-bottom:12px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:11px 8px;
  border-bottom:1px solid #e5e9f0;
  text-align:left;
}

th{
  background:#eef3ff;
}

.low{
  color:#d93025;
  font-weight:bold;
}

.ok{
  color:#168a4a;
  font-weight:bold;
}

.empty{
  text-align:center;
  padding:25px;
  color:#777;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.form-grid .full{
  grid-column:1/-1;
}

.actions{
  white-space:nowrap;
}

.footer{
  text-align:center;
  color:#777;
  padding:20px;
  font-size:13px;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .stat{
    font-size:13px;
  }

  .stat strong{
    font-size:19px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-grid .full{
    grid-column:auto;
  }

  .header h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>द्वारकाधिश स्टॉक मॅनेजर</h1>
  <p>स्टॉकची नोंद • खरेदी • विक्री • शिल्लक</p>
</div>

<div class="container">

  <div class="card">
    <h2>📊 स्टॉकचा आढावा</h2>

    <div class="stats">
      <div class="stat">
        एकूण वस्तू
        <strong id="totalProducts">0</strong>
      </div>

      <div class="stat">
        एकूण स्टॉक
        <strong id="totalStock">0</strong>
      </div>

      <div class="stat">
        कमी स्टॉक
        <strong id="lowStock">0</strong>
      </div>
    </div>
  </div>


  <div class="card">
    <h2>➕ नवीन स्टॉक नोंद</h2>

    <div class="form-grid">

      <div class="full">
        <label>वस्तूचे नाव</label>
        <input id="name" type="text" placeholder="उदा. तांदूळ">
      </div>

      <div>
        <label>प्रमाण</label>
        <input id="qty" type="number" min="0" placeholder="0">
      </div>

      <div>
        <label>किमान स्टॉक</label>
        <input id="minQty" type="number" min="0" value="5">
      </div>

      <div>
        <label>खरेदी दर ₹</label>
        <input id="purchase" type="number" min="0" step="0.01" placeholder="0">
      </div>

      <div>
        <label>विक्री दर ₹</label>
        <input id="sale" type="number" min="0" step="0.01" placeholder="0">
      </div>

    </div>

    <button class="primary" onclick="addProduct()">
      💾 स्टॉक सेव्ह करा
    </button>

    <button class="light" onclick="clearForm()">
      साफ करा
    </button>
  </div>


  <div class="card">
    <h2>🔎 स्टॉक शोधा</h2>

    <input
      class="search"
      id="search"
      type="text"
      placeholder="वस्तूचे नाव शोधा..."
      oninput="displayProducts()"
    >

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>वस्तू</th>
            <th>प्रमाण</th>
            <th>खरेदी दर</th>
            <th>विक्री दर</th>
            <th>स्थिती</th>
            <th>कृती</th>
          </tr>
        </thead>

        <tbody id="productTable"></tbody>
      </table>
    </div>
  </div>


  <div class="card">
    <h2>🛒 विक्री नोंद</h2>

    <label>वस्तू निवडा</label>
    <select id="saleProduct">
      <option value="">वस्तू निवडा</option>
    </select>

    <label>विकलेले प्रमाण</label>
    <input id="saleQty" type="number" min="1" placeholder="0">

    <button class="success" onclick="sellProduct()">
      विक्री सेव्ह करा
    </button>
  </div>


  <div class="card">
    <h2>📦 स्टॉकमध्ये भर</h2>

    <label>वस्तू निवडा</label>
    <select id="stockProduct">
      <option value="">वस्तू निवडा</option>
    </select>

    <label>जोडायचे प्रमाण</label>
    <input id="addQty" type="number" min="1" placeholder="0">

    <button class="primary" onclick="addStock()">
      स्टॉक वाढवा
    </button>
  </div>

</div>

<div class="footer">
  द्वारकाधिश स्टॉक मॅनेजर
</div>


<script>

let products =
  JSON.parse(localStorage.getItem("dwarkadhishStock")) || [];

let editId = null;


/* स्टॉक सेव्ह */
function saveData(){
  localStorage.setItem(
    "dwarkadhishStock",
    JSON.stringify(products)
  );
}


/* नवीन वस्तू */
function addProduct(){

  const name =
    document.getElementById("name").value.trim();

  const qty =
    Number(document.getElementById("qty").value);

  const minQty =
    Number(document.getElementById("minQty").value);

  const purchase =
    Number(document.getElementById("purchase").value);

  const sale =
    Number(document.getElementById("sale").value);


  if(!name){
    alert("कृपया वस्तूचे नाव टाका.");
    return;
  }

  if(qty < 0){
    alert("प्रमाण चुकीचे आहे.");
    return;
  }


  /* Edit */
  if(editId !== null){

    const index =
      products.findIndex(p => p.id === editId);

    if(index !== -1){

      products[index] = {
        ...products[index],
        name,
        qty,
        minQty,
        purchase,
        sale
      };

    }

    editId = null;

  }else{

    products.push({
      id:Date.now(),
      name,
      qty,
      minQty,
      purchase,
      sale
    });

  }


  saveData();
  clearForm();
  displayProducts();
  updateSelects();
  updateStats();

  alert("स्टॉक सेव्ह झाला.");
}


/* फॉर्म साफ */
function clearForm(){

  document.getElementById("name").value = "";
  document.getElementById("qty").value = "";
  document.getElementById("minQty").value = "5";
  document.getElementById("purchase").value = "";
  document.getElementById("sale").value = "";

  editId = null;
}


/* वस्तू दाखवा */
function displayProducts(){

  const tbody =
    document.getElementById("productTable");

  const search =
    document.getElementById("search").value
    .trim()
    .toLowerCase();


  let list =
    products.filter(p =>
      p.name.toLowerCase().includes(search)
    );


  if(list.length === 0){

    tbody.innerHTML =
      `<tr>
        <td colspan="6" class="empty">
          स्टॉक उपलब्ध नाही.
        </td>
      </tr>`;

    return;
  }


  tbody.innerHTML = list.map(p => {

    const low =
      p.qty <= p.minQty;

    return `
      <tr>

        <td><strong>${escapeHtml(p.name)}</strong></td>

        <td>${p.qty}</td>

        <td>₹${Number(p.purchase).toFixed(2)}</td>

        <td>₹${Number(p.sale).toFixed(2)}</td>

        <td class="${low ? "low" : "ok"}">
          ${low ? "कमी स्टॉक" : "उपलब्ध"}
        </td>

        <td class="actions">

          <button
            class="light"
            onclick="editProduct(${p.id})">
            Edit
          </button>

          <button
            class="danger"
            onclick="deleteProduct(${p.id})">
            Delete
          </button>

        </td>

      </tr>
    `;

  }).join("");
}


/* Edit */
function editProduct(id){

  const p =
    products.find(x => x.id === id);

  if(!p) return;


  document.getElementById("name").value = p.name;
  document.getElementById("qty").value = p.qty;
  document.getElementById("minQty").value = p.minQty;
  document.getElementById("purchase").value = p.purchase;
  document.getElementById("sale").value = p.sale;

  editId = id;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* Delete */
function deleteProduct(id){

  const p =
    products.find(x => x.id === id);

  if(!p) return;


  if(
    confirm(
      `"${p.name}" हा स्टॉक डिलीट करायचा आहे का?`
    )
  ){

    products =
      products.filter(x => x.id !== id);

    saveData();
    displayProducts();
    updateSelects();
    updateStats();
  }
}


/* विक्री */
function sellProduct(){

  const id =
    Number(document.getElementById("saleProduct").value);

  const qty =
    Number(document.getElementById("saleQty").value);


  if(!id){
    alert("कृपया वस्तू निवडा.");
    return;
  }

  if(qty <= 0){
    alert("विक्रीचे प्रमाण टाका.");
    return;
  }


  const p =
    products.find(x => x.id === id);


  if(!p) return;


  if(qty > p.qty){

    alert(
      `उपलब्ध स्टॉक फक्त ${p.qty} आहे.`
    );

    return;
  }


  p.qty -= qty;

  saveData();
  displayProducts();
  updateSelects();
  updateStats();

  document.getElementById("saleQty").value = "";

  alert("विक्री नोंद सेव्ह झाली.");
}


/* स्टॉक वाढवा */
function addStock(){

  const id =
    Number(document.getElementById("stockProduct").value);

  const qty =
    Number(document.getElementById("addQty").value);


  if(!id){
    alert("कृपया वस्तू निवडा.");
    return;
  }

  if(qty <= 0){
    alert("प्रमाण टाका.");
    return;
  }


  const p =
    products.find(x => x.id === id);


  if(!p) return;


  p.qty += qty;

  saveData();
  displayProducts();
  updateSelects();
  updateStats();

  document.getElementById("addQty").value = "";

  alert("स्टॉक वाढवला.");
}


/* Dropdown */
function updateSelects(){

  const saleSelect =
    document.getElementById("saleProduct");

  const stockSelect =
    document.getElementById("stockProduct");


  saleSelect.innerHTML =
    `<option value="">वस्तू निवडा</option>`;

  stockSelect.innerHTML =
    `<option value="">वस्तू निवडा</option>`;


  products.forEach(p => {

    const option1 =
      document.createElement("option");

    option1.value = p.id;
    option1.textContent =
      `${p.name} (${p.qty})`;

    saleSelect.appendChild(option1);


    const option2 =
      document.createElement("option");

    option2.value = p.id;
    option2.textContent =
      `${p.name} (${p.qty})`;

    stockSelect.appendChild(option2);

  });
}


/* Stats */
function updateStats(){

  document.getElementById("totalProducts")
    .textContent = products.length;


  const total =
    products.reduce(
      (sum,p) => sum + Number(p.qty),
      0
    );

  document.getElementById("totalStock")
    .textContent = total;


  const low =
    products.filter(
      p => Number(p.qty) <= Number(p.minQty)
    ).length;

  document.getElementById("lowStock")
    .textContent = low;
}


/* सुरक्षित HTML */
function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* सुरुवातीला */
displayProducts();
updateSelects();
updateStats();

</script>

</body>
</html>
