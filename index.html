<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1554d1">

<title>द्वारकाधिश स्टॉक मॅनेजर</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fc;
  color:#172033;
}

.header{
  background:#1554d1;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0 0 6px;
  font-size:27px;
}

.header p{
  margin:0;
  font-size:14px;
}

.container{
  max-width:760px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:16px;
  padding:16px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

h2{
  margin-top:0;
  font-size:20px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd3df;
  border-radius:10px;
  margin-bottom:10px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-size:15px;
  cursor:pointer;
}

.primary{
  background:#1554d1;
  color:white;
}

.success{
  background:#168a4a;
  color:white;
}

.danger{
  background:#d9363e;
  color:white;
}

.light{
  background:#eaf1ff;
  color:#1554d1;
}

.search{
  width:100%;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#f0f5ff;
  padding:14px 8px;
  border-radius:12px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:22px;
  color:#1554d1;
}

.product{
  border:1px solid #e0e5ed;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
}

.product-title{
  font-size:18px;
  font-weight:bold;
}

.product-info{
  color:#555;
  margin:7px 0;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.actions button{
  flex:1;
  min-width:90px;
}

.empty{
  text-align:center;
  color:#777;
  padding:25px 10px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  padding:15px;
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .header h1{
    font-size:23px;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>द्वारकाधिश स्टॉक मॅनेजर</h1>
  <p>स्टॉकची नोंदणी • संपादन • विक्री • डिलीट</p>
</div>

<div class="container">

  <div class="card">
    <h2>📊 स्टॉक माहिती</h2>

    <div class="stats">
      <div class="stat">
        <b id="totalProducts">0</b>
        एकूण वस्तू
      </div>

      <div class="stat
